name: Gardening Assistant CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Check React Native Frontend
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Check for Syntax Errors (Lint)
        run: npm run lint --if-present

  # Job 2: Check Python Backend
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          cd pest-backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test Server Startup
        run: |
          cd pest-backend
          # This checks if the python file has syntax errors without fully running the server
          python -m py_compile app.py